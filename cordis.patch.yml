# dsh-agent-prompt bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process and mounts the /api/agent-prompt routes, and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client") load in the web GUI as the sidebar panel.
- insert:
    - id: agent-prompt
      name: 'dsh-agent-prompt'
