name: Bug report
description: Report a reproducible defect in dsh-agent-prompt so it can be fixed
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Fill in every field — incomplete reports are hard to
        act on. Redact secrets, tokens, private keys, internal hostnames, and personal
        data; use placeholders such as `192.0.2.10`, `you@example.com`, `<YOUR_API_KEY>`.
        An instruction file body can itself be sensitive, so redact it too.

        **Security vulnerability?** Stop and read SECURITY.md instead. Never open a
        public issue for a vulnerability.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      description: Confirm each item before submitting.
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am running the latest release or a recent commit of main.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, version number, or commit SHA of dsh-agent-prompt where the bug occurs.
      placeholder: "v0.1.0 or 1a2b3c4"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version, and the DeepSeek Harness build you ran it against.
      placeholder: "macOS 15.5, Node 22.18.0, pnpm 11.8.0, dsh 0.2.0-rc.2"
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Affected file
      description: Which node of the tree misbehaves — the user-global file, or a workspace's AGENTS.md (name the workspace).
      placeholder: "user-global ($DSH_HOME/AGENTS.md) / workspace: my-project"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact, minimal steps. Number them. Include the command or the UI path.
      placeholder: |
        1. Open the Agent Prompt panel and select '...'
        2. Type or save '...'
        3. Observe '...'
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, including the full error text.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, stack trace, or screenshots
      description: Paste raw output, not a screenshot of text, where possible. If you called the HTTP API directly, include the exact /api/agent-prompt/* request and response.
      render: text
    validations:
      required: false

  - type: dropdown
    id: regression
    attributes:
      label: Did this work before?
      options:
        - "No — first time using this feature"
        - "Yes — it regressed in a later version"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Anything that makes the bug go away, even partly.
    validations:
      required: false

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
